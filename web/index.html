<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Stratux</title>
  <meta name="description" content="Stratux ADS-B, UAT, OGN, AIS, GPS &amp; AHRS Avionics Receiver" />
  <meta name="theme-color" content="#0b0f14" id="meta-theme-color" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="img/logo-android3.png" />
  <link rel="apple-touch-icon" href="img/logo-apple3.png" />
  <link rel="stylesheet" href="css/ol.css" />
  <link rel="stylesheet" href="css/ol-layerswitcher.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('stratux.theme');
        if (t === 'day' || t === 'dark' || t === 'night') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary Navigation">
      <div class="sidebar-brand">
        <a href="#/status" class="brand-link">
          <img src="img/logo-android3.png" alt="Stratux" width="28" height="28" />
          <span class="brand-title">Stratux</span>
        </a>
        <button type="button" class="icon-btn sidebar-close" id="btn-sidebar-close" aria-label="Close navigation">&times;</button>
      </div>
      <nav class="nav-list" id="nav-list">
        <a class="nav-item" href="#/status" data-route="status"><span class="nav-icon" aria-hidden="true">&#9673;</span><span>Status</span></a>
        <a class="nav-item" href="#/traffic" data-route="traffic"><span class="nav-icon" aria-hidden="true">&#9992;</span><span>Traffic</span></a>
        <a class="nav-item" href="#/radar" data-route="radar"><span class="nav-icon" aria-hidden="true">&#9737;</span><span>Radar</span></a>
        <a class="nav-item" href="#/map" data-route="map"><span class="nav-icon" aria-hidden="true">&#9873;</span><span>Map</span></a>
        <a class="nav-item" href="#/gps" data-route="gps"><span class="nav-icon" aria-hidden="true">&#8982;</span><span>GPS / AHRS</span></a>
        <a class="nav-item" href="#/weather" data-route="weather" data-uat-only="1"><span class="nav-icon" aria-hidden="true">&#9729;</span><span>Weather</span></a>
        <a class="nav-item" href="#/towers" data-route="towers" data-uat-only="1"><span class="nav-icon" aria-hidden="true">&#9889;</span><span>Towers</span></a>
        <a class="nav-item" href="#/flights" data-route="flights"><span class="nav-icon" aria-hidden="true">&#128205;</span><span>Flights</span></a>
        <a class="nav-item" href="#/settings" data-route="settings"><span class="nav-icon" aria-hidden="true">&#9881;</span><span>Settings</span></a>
        <a class="nav-item hidden" href="#/developer" data-route="developer" id="nav-developer"><span class="nav-icon" aria-hidden="true">&#9874;</span><span>Developer</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="theme-group" role="group" aria-label="Cockpit Theme">
          <button type="button" class="theme-btn" data-theme-choice="day" title="Day Sunlight Theme">Day</button>
          <button type="button" class="theme-btn" data-theme-choice="dark" title="Dark Cockpit Theme">Dark</button>
          <button type="button" class="theme-btn" data-theme-choice="night" title="Red Night-Vision Mode">Night</button>
        </div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="icon-btn menu-toggle" id="btn-menu-toggle" aria-label="Open menu">&#9776;</button>
          <h1 class="topbar-title" id="topbar-title">Status</h1>
        </div>
        <div class="topbar-right">
          <div class="theme-group theme-group-compact" role="group" aria-label="Theme switcher">
            <button type="button" class="theme-btn" data-theme-choice="day">Day</button>
            <button type="button" class="theme-btn" data-theme-choice="dark">Dark</button>
            <button type="button" class="theme-btn" data-theme-choice="night">Night</button>
          </div>
          <span class="conn-badge conn-disconnected" id="conn-badge" title="WebSocket link status">
            <span class="conn-dot"></span>
            <span id="conn-label">Offline</span>
          </span>
        </div>
      </header>

      <main id="view" class="view-container" tabindex="-1"></main>

      <nav class="bottom-nav" id="bottom-nav" aria-label="Quick Navigation">
        <a class="bottom-item" href="#/status" data-route="status"><span>&#9673;</span><small>Status</small></a>
        <a class="bottom-item" href="#/traffic" data-route="traffic"><span>&#9992;</span><small>Traffic</small></a>
        <a class="bottom-item" href="#/radar" data-route="radar"><span>&#9737;</span><small>Radar</small></a>
        <a class="bottom-item" href="#/map" data-route="map"><span>&#9873;</span><small>Map</small></a>
        <a class="bottom-item" href="#/gps" data-route="gps"><span>&#8982;</span><small>AHRS</small></a>
        <a class="bottom-item" href="#/settings" data-route="settings"><span>&#9881;</span><small>Settings</small></a>
      </nav>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="js/ol.js" defer></script>
  <script src="js/olms.js" defer></script>
  <script src="js/ol-layerswitcher.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
